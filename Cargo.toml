[package]
name = "eigenlog"
version = "0.3.0"
edition = "2021"

[[example]]
name = "client"
required-features = ["client", "bincode"]

[[example]]
name = "server"
required-features = ["server"]

[workspace]
members = ["xtask"]

[dependencies]
http = "1.1"
once_cell = "1.19.0"
regex = "1.10.6"
thiserror = "1.0.30"
uuid = "1.10.0"
futures-util = "0.3.21"
futures-channel = "0.3.21"
tokio = "1.39.2"

[dependencies.async-trait]
version = "0.1.52"
optional = true 

[dependencies.bincode-crate]
version = "1.3.3"
package = "bincode"
optional = true

[dependencies.chrono]
version = "0.4.19"
default-features = false
features = ["serde","std"]

[dependencies.log]
version = "0.4.14"
features = ["serde", "std"]

[dependencies.reqwest]
version = "0.12.5"
features = ["rustls-tls"]
default-features = false
optional = true

[dependencies.url]
version = "2.5.2"
optional = true

[dependencies.serde]
version = "1.0.136"
features = ["derive"]

[dependencies.serde_json]
version = "1.0.79"
optional = true

[dependencies.sled]
version = "0.34.7"
optional = true 

[dependencies.ulid]
version = "1.1.3"
features = ["serde", "uuid"]

[dependencies.warp]
version = "0.3.2"
default-features = false
optional = true

[dev-dependencies]
names = "0.11"
structopt = "0.3"
anyhow = "1"
serde_json = "1"
csv = "1"
comfy-table = "4"
strum = "0.21"
strum_macros = "0.21"
env_logger = "0.9"

[dev-dependencies.tokio]
version = "1.39.2"
features = ["full"]

[features]
json = ["serde_json", "reqwest/json"]
bincode = [ "bincode-crate" ]
client = ["reqwest", "async-trait", "url"]
remote-subscriber = ["reqwest", "async-trait", "url"] # needs one of bincode or json
local-subscriber = ["bincode", "async-trait"]
server = ["warp", "bincode", "async-trait"]
wasm = []
wasm-client = ["client", "wasm"]
wasm-subscriber = ["remote-subscriber", "wasm"]
default = []
all = ["client", "server", "remote-subscriber", "local-subscriber", "json", "bincode", "url", "sled"]
reqwest = ["dep:reqwest"]
url = ["dep:url"]


