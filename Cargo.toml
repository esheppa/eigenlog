[package]
name = "eigenlog"
version = "0.3.0"
edition = "2021"

[workspace]
members = ["xtask"]

[dependencies]
http = "0.2.12"
once_cell = "1.10.0"
regex = "1.10.4"
thiserror = "1.0.30"
futures-util = "0.3.30"
futures-channel = "0.3.30"

[dependencies.async-trait]
version = "0.1.80"
optional = true 

[dependencies.chrono]
version = "0.4.38"
default-features = false
features = ["serde", "now", "std"]

[dependencies.log]
version = "0.4.21"
features = ["serde", "std"]

[dependencies.reqwest]
version = "0.11.27"
features = ["rustls-tls", "json"]
default-features = false
optional = true

[dependencies.url]
version = "2.5.0"
optional = true

[dependencies.serde]
version = "1.0.202"
features = ["derive"]

[dependencies.serde_json]
version = "1.0.117"

[dependencies.uuid]
version = "1.8.0"
features = ["v7", "serde"]

[dependencies.warp]
version = "0.3.7"
default-features = false
optional = true

[dev-dependencies]
names = "0.11"
structopt = "0.3"
anyhow = "1"
serde_json = "1"
csv = "1"
comfy-table = "4"
strum = "0.21"
strum_macros = "0.21"
env_logger = "0.9"

[dev-dependencies.tokio]
version = "1.17.0"
features = ["full"]

[features]
client = ["reqwest", "async-trait", "url"]
remote-subscriber = ["reqwest", "async-trait", "url"]
local-subscriber = ["async-trait"]
server = ["warp", "async-trait"]
wasm = []
wasm-client = ["client", "wasm"]
wasm-subscriber = ["remote-subscriber", "wasm"]
default = []
all = ["client", "server", "remote-subscriber", "local-subscriber", "url"]


